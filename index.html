<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#111827"/><title>ONEWAY — Find the odd one</title><link rel="stylesheet" href="style.css"/></head><body><main class="app"><header><div class="brand">ONE<span>WAY</span></div><div class="sub">Find the one that doesn't belong.</div></header><nav aria-label="Game modes"><button data-mode="classic" class="active">Classic</button><button data-mode="rush">60s Rush</button><button data-mode="daily">Daily</button></nav><section class="stats"><div><small>LEVEL</small><strong id="level">1</strong></div><div><small>SCORE</small><strong id="score">0</strong></div><div><small id="third-label">MISTAKES</small><strong id="third">0</strong></div></section><p id="instruction" aria-live="polite">Tap the odd symbol.</p><div id="board" class="board" role="group" aria-label="Puzzle tiles"></div><div id="message" aria-live="polite"></div><div class="actions"><button id="restart">Restart</button><button id="share">Share score</button></div><footer>ONEWAY • Puzzle prototype • No accounts or ads</footer></main><script src="game.js"></script></body></html>
